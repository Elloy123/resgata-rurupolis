{% comment %}Renderiza os campos de um formulário Bootstrap com label associado e erros.{% endcomment %}
{% if form.non_field_errors %}
<div class="alert alert-danger">{{ form.non_field_errors|striptags }}</div>
{% endif %}
{% for field in form %}
<div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>{% endif %}
</div>
{% endfor %}
