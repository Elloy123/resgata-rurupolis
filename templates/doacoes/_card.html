{% comment %}Card de vaquinha reutilizado na home e na listagem. Parâmetro: campanha.{% endcomment %}
<div class="col-md-4">
    <div class="card card-campanha h-100 shadow-sm">
        {% if campanha.imagem %}
        <img src="{{ campanha.imagem.url }}" class="card-img-top" alt="{{ campanha.titulo }}" loading="lazy">
        {% else %}
        <img src="https://placehold.co/400x200?text={{ campanha.titulo|urlencode }}" class="card-img-top" alt="{{ campanha.titulo }} (sem imagem)" loading="lazy">
        {% endif %}
        <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ campanha.titulo }}</h5>
            <p class="card-text text-secondary small flex-grow-1">{{ campanha.descricao|truncatewords:20 }}</p>
            {% include 'doacoes/_progresso.html' %}
            <a href="{% url 'doacoes:detalhe' campanha.slug %}" class="btn btn-primary btn-sm mt-3 stretched-link">Contribuir</a>
        </div>
    </div>
</div>
